<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e8c">
  <title>Άδειες & Υπερωρίες</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="login-card">
      <img src="/icons/icon-192.png" alt="" width="72" height="72">
      <h1>Άδειες & Υπερωρίες</h1>
      <p>Ιστορικό, υπόλοιπα και σημείωμα υπερωριών</p>
      <button id="btnLogin" class="btn primary">Σύνδεση με Google</button>
      <p id="loginMsg" class="muted"></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <h1 id="title">Ημερολόγιο</h1>
      <div id="topActions"></div>
    </header>
    <main id="view"></main>
    <nav class="tabs">
      <a href="#/month" data-tab="month"><span class="ic">📅</span><span>Ημερολόγιο</span></a>
      <a href="#/balances" data-tab="balances"><span class="ic">⚖️</span><span>Υπόλοιπα</span></a>
      <a href="#/stats" data-tab="stats"><span class="ic">📊</span><span>Σύνολα</span></a>
      <a href="#/ots" data-tab="ots"><span class="ic">🔍</span><span>OTS</span></a>
      <a href="#/settings" data-tab="settings"><span class="ic">⚙️</span><span>Ρυθμίσεις</span></a>
    </nav>
  </div>

  <dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
